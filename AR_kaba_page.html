<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>カバくん AR撮影</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#kaba{width:min(82vw,520px);max-height:72vh;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55));opacity:0;transform:translateY(25px) scale(.82) rotate(-2deg);transition:opacity .25s,transform .55s cubic-bezier(.2,.8,.2,1)}
#kaba.show{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}
#flash.on{animation:flash .22s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#top{position:absolute;top:max(18px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#fff;z-index:4}
.badge{padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-weight:700;font-size:13px}
#controls{position:absolute;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));z-index:5;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);border-radius:20px;padding:12px;color:#fff}
.row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
button{border:0;border-radius:14px;padding:10px 13px;background:#fff;color:#111;font-weight:800;white-space:nowrap}
button.secondary{background:rgba(255,255,255,.16);color:#fff}
#start{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#07142a,#123b66);color:white;text-align:center;padding:28px}
.card{max-width:360px}
h1{font-size:30px;margin:0 0 10px} p{line-height:1.55;opacity:.9}
#start button{font-size:17px;padding:14px 22px;margin-top:10px}
.small{font-size:12px;opacity:.7;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <video id="cam" autoplay playsinline muted></video>
  <div id="stage"><img id="kaba" alt="カバくん"></div>
  <div id="flash"></div>
  <div id="top"><div class="badge">🐊 カバくん AR撮影</div><div class="badge" id="status">準備中</div></div>
  <div id="controls">
    <div style="font-size:13px;margin-bottom:8px">カバを選ぶ</div>
    <div class="row" id="buttons"></div>
    <div class="row" style="margin-top:6px">
      <button class="secondary" id="animate">▶ 動かす</button>
      <button class="secondary" id="shot">📸 スクリーンショット</button>
      <button class="secondary" id="switch">🔄 カメラ切替</button>
    </div>
  </div>
  <div id="start">
    <div class="card">
      <div style="font-size:58px">🐊</div>
      <h1>カバくん AR撮影</h1>
      <p>カメラを起動して、好きなカバくんを画面に重ねて撮影できます。</p>
      <button id="go">カメラを起動</button>
      <div class="small">※ iPhoneではSafariなどHTTPSで公開したページから利用してください。</div>
    </div>
  </div>
</div>

const cam=document.getElementById('cam'), kaba=document.getElementById('kaba');
const status=document.getElementById('status'), start=document.getElementById('start');
const btns=document.getElementById('buttons');
let current=0, stream=null, facing='environment', timer=null;

imgs.forEach((src,i)=>{
  const b=document.createElement('button'); b.textContent=`カバ ${i+1}`;
  b.onclick=()=>show(i); btns.appendChild(b);
});

async function openCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});
    cam.srcObject=stream; status.textContent='カメラON'; start.style.display='none'; show(current);
  }catch(e){status.textContent='カメラ許可が必要'; alert('カメラの使用を許可してください。');}
}
function show(i){
  current=i; kaba.src=imgs[i]; kaba.classList.remove('show');
  requestAnimationFrame(()=>kaba.classList.add('show'));
}
function animate(){
  let i=0; clearInterval(timer);
  timer=setInterval(()=>{show(i++ % imgs.length);},700);
}
document.getElementById('go').onclick=openCam;
document.getElementById('animate').onclick=animate;
document.getElementById('switch').onclick=()=>{facing=facing==='environment'?'user':'environment';openCam()};
document.getElementById('shot').onclick=()=>{
  document.getElementById('flash').classList.remove('on'); void document.getElementById('flash').offsetWidth; document.getElementById('flash').classList.add('on');
  // Mobile browser screenshot is intentionally delegated to the OS/browser.
  alert('撮影する場合は、iPhoneのスクリーンショット機能をご利用ください。');
};
</script>
